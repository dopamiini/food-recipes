
<!DOCTYPE html>
<html>

<head>
  <title>Remove comment</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body>
  <h1><span class="logo-black">Recep</span><span class="logo-grey">io</span></h1>
  <hr>
  <h2>Remove comment</h2>
  <p>Comment: {{ comment["comment"] }}</p>
  <p>Are you sure you want to remove this comment?</p>

  <form action="/remove_comment/{{ comment.id }}" method="POST">
    <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
    <input type="submit" name="remove" value="Remove">
    <input type="submit" name="back" value="Cancel">
  </form>

</body>

</html>
