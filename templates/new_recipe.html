<!DOCTYPE html>
<html>

<head>
  <title>New Recipe</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>

<body>
  <h1>Recepio</h1>
  <p>
    <a href="/">Back</a>
  </p>
  <hr>
  {% if message %}
    <p id="message" class="{{ message_type }}">{{ message }}</p>
  {% endif %}
  <h2>New recipe</h2>
  <form action="/create_recipe" method="post">
    <p>
      Name: <br>
      <input type="text" name="title" maxlength="50" size="50">
    </p>
    <p>
      Description: <br>
      <textarea name="description" rows="8" cols="80" maxlength="1000"></textarea>
    </p>
    <p>
      Ingredients: <br>
      <textarea name="ingredients" rows="4" cols="80" maxlength="1000"></textarea>
    </p>
    <p>
      Instructions: <br>
      <textarea name="instructions" rows="8" cols="80" maxlength="1000"></textarea>
    </p>
    <p>
      <label for="recipe_type">Recipe type:</label>
      <select name="recipe_type" required>
        <option value="" disabled selected>Choose a recipe type</option>
        <option value="Appetizer">Appetizer</option>
        <option value="Main course">Main course</option>
        <option value="Dessert">Dessert</option>
      </select>
    </p>
     <p>
      <label for="diet">Diet:</label>
      <select name="diet" id="diet" required>
        <option value="" disabled selected>Choose a diet</option>
        <option value="none">None</option>
        <option value="Vegan">Vegan</option>
        <option value="Gluten-free">Gluten-free</option>
        <option value="Lactose-free">Lactose-free</option>
      </select>
    </p>
    <input type="submit" value="Add">
  </form>
</body>

</html>
