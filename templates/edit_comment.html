
<!DOCTYPE html>
<html>
<head>
    <title>Edit comment</title>
</head>
<body>
    <h1>Edit comment</h1>

    <form action="/edit_comment/{{ comment.id }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">

        <label for="comment">Comment:</label>

        <textarea id="comment" name="comment" required rows="4">{{ comment_text if comment_text is defined else comment.comment }}</textarea>

        <button type="submit">Update</button>
    </form>

    <a href="/recipe/{{ comment.recipe_id }}">Cancel</a>
</body>
</html>
