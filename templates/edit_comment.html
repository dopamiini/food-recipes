<!DOCTYPE html>
<html>

<head>
  <title>Edit comment/title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/main.css') }}">
</head>

<body>
  <h1><span class="logo-black">Recep</span><span class="logo-grey">io</span></h1>
  <p><a href="/recipe/{{ comment.recipe_id }}">Back</a></p>
  <hr>
  <h2>Edit comment</h2>
    <form action="/edit_comment/{{ comment.id }}" method="POST">
      <textarea id="comment" name="comment" required rows="4" cols="60" maxlength="200">{{ comment_text if comment_text is defined else comment.comment }}</textarea>
      <br>
      <input type="hidden" name="csrf_token" value="{{ session.csrf_token }}">
      <button type="submit">Update</button>
    </form>
</body>

</html>
