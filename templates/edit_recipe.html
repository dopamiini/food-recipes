<!DOCTYPE html>
<html>

<head>
  <title>Edit Recipe</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>

<body>
  <h1>Recepio</h1>
  <p><a href="/">Back</a></p>
  <hr>
  <h2>Edit recipe</h2>
  <form action="/update_recipe" method="post">
    <p>
      Name: <br/>
      <input type="text" name="title" maxlength="50" size="50" value="{{ recipe.title }}"/>
    </p>
    <p>
      Description: <br />
      <textarea name="description" rows="8" cols="80" maxlength="1000">{{ recipe.description }}</textarea>
    </p>
    <p>
      Ingredients: <br />
      <textarea name="ingredients" rows="4" cols="80" maxlength="1000">{{ recipe.ingredients }}</textarea>
    </p>
    <p>
      Instructions: <br />
      <textarea name="instructions" rows="8" cols="80" maxlength="1000">{{ recipe.instructions }}</textarea>
    </p>
    <input type="hidden" name="recipe_id" value="{{recipe.id}}">
    {% for group in all_categories %}
    <p>
      {{ group }}: <br>
      <select name="categories">
        <option value="">Choose a category</option>
      {% for option in all_categories[group] %}
        {% if categories[group] == option %}
          <option value="{{ group }}:{{ option }}" selected>{{ option }}</option>
        {% else %}
          <option value="{{ group }}:{{ option }}">{{ option }}</option>
        {% endif %}
      {% endfor %}
      </select>
    </p>
    {% endfor %}
    <input type="submit" value="Update" />
  </form>
</body>

</html>
